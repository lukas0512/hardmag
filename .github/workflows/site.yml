name: HARDMAG — website

# Builds hardmag.pt from state/articles.json and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["state/articles.json", "src/site.ts", "src/templates.ts", "src/articles.ts", ".github/workflows/site.yml"]
  workflow_run:
    workflows: ["HARDMAG — post"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node src/site.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
