name: HARDMAG — post

on:
  schedule:
    # Three slots a day, Portugal focus (UTC = Lisbon winter time), each with 0-25 min of random jitter.
    - cron: "50 8 * * *"   # pt-news
    - cron: "30 13 * * *"  # pt-artists (spotlight or Portuguese artist news)
    - cron: "45 19 * * *"  # pt-scene
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (render only, don't publish)"
        type: boolean
        default: false
      count:
        description: "Posts in this run"
        default: "1"
      gap:
        description: "Minutes between posts (launch mode)"
        default: "0"
      tip:
        description: "Post this hand-picked story instead (path to a state/tips/*.json file)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: hardmag-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_HOST: ${{ secrets.IG_API_HOST }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MEDIA_REPO: ${{ github.repository }}
      BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@hardmag.news' }}
    steps:
      # Latest main, not the commit from when the run was queued: queued runs otherwise post
      # with old code and can't save state (rebase conflicts on a detached HEAD).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Claude Code (writes the posts on your Claude subscription)
        run: npm install -g @anthropic-ai/claude-code
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Install ffmpeg (motion covers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run pipeline
        run: |
          git config user.name "hardmag-bot"
          git config user.email "hardmag-bot@users.noreply.github.com"
          # Pause: scheduled slots are skipped until the date in the PAUSE_UNTIL repo variable (YYYY-MM-DD).
          if [ -n "${{ github.event.schedule }}" ] && [ -n "${{ vars.PAUSE_UNTIL }}" ] && [[ "$(date -u +%F)" < "${{ vars.PAUSE_UNTIL }}" ]]; then
            echo "Paused until ${{ vars.PAUSE_UNTIL }}: skipping this slot."; exit 0
          fi
          ARGS="--count ${{ inputs.count || '1' }} --gap ${{ inputs.gap || '0' }}"
          case "${{ github.event.schedule }}" in
            "50 8 * * *") ARGS="--slot pt-news --jitter 25" ;;
            "30 13 * * *") ARGS="--slot pt-artists --jitter 25" ;;
            "45 19 * * *") ARGS="--slot pt-scene --jitter 25" ;;
          esac
          if [ -n "${{ inputs.tip }}" ]; then ARGS="--tip ${{ inputs.tip }}"; fi
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          node src/run.ts $ARGS
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: out/
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "hardmag-bot"
          git config user.email "hardmag-bot@users.noreply.github.com"
          git add state/state.json state/articles.json state/handles-pending.json state/performance.json reports/desempenho.md 2>/dev/null || true; git add state/state.json state/articles.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase && git push)
