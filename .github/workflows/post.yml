name: HARDMAG — post

on:
  schedule:
    # Four themed slots a day (UTC = Lisbon winter time), each with 0-25 min of random jitter.
    - cron: "50 7 * * *"   # lisbon
    - cron: "40 12 * * *"  # club / hard techno
    - cron: "30 17 * * *"  # AI, tech, debates
    - cron: "45 20 * * *"  # artists / viral
    # News radar: every hour, posts only if something breaking (heat 9+) lands; max 5 posts/24h overall.
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (render only, don't publish)"
        type: boolean
        default: false
      count:
        description: "Posts in this run"
        default: "1"
      gap:
        description: "Minutes between posts (launch mode)"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: hardmag-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_HOST: ${{ secrets.IG_API_HOST }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MEDIA_REPO: ${{ github.repository }}
      BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@hardmag.news' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Claude Code (writes the posts on your Claude subscription)
        run: npm install -g @anthropic-ai/claude-code
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Install ffmpeg (motion covers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run pipeline
        run: |
          git config user.name "hardmag-bot"
          git config user.email "hardmag-bot@users.noreply.github.com"
          ARGS="--count ${{ inputs.count || '1' }} --gap ${{ inputs.gap || '0' }}"
          case "${{ github.event.schedule }}" in
            "35 * * * *") ARGS="--radar" ;;
            "50 7 * * *") ARGS="--slot lisbon --jitter 25" ;;
            "40 12 * * *") ARGS="--slot club --jitter 25" ;;
            "30 17 * * *") ARGS="--slot tech --jitter 25" ;;
            "45 20 * * *") ARGS="--slot artists --jitter 25" ;;
          esac
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          node src/run.ts $ARGS
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: out/
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "hardmag-bot"
          git config user.email "hardmag-bot@users.noreply.github.com"
          git add state/state.json state/articles.json state/handles-pending.json state/performance.json reports/desempenho.md 2>/dev/null || true; git add state/state.json state/articles.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase && git push)
