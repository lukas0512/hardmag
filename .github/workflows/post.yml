name: HARDMAG — post

# Editorial queue (see src/queue.ts). Every trigger:
#   1. plan: is a prepared post due? which upcoming slot still needs preparing?
#   2. publish the due post (only builds and publishes: about a minute)
#   3. prepare the next slot up to 48 h ahead: write, chief-editor review, render, host,
#      and test-build the post on Instagram without publishing it. It then waits in state/queue.json.
# Slots (UTC = Lisbon winter time, ±20 min per day): pt-news 08:50, pt-artists 13:30, pt-scene 19:45.
# GitHub's cron is best effort (it can skip hours), so the backup trigger also calls this with auto=true.

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: "Scheduler mode: publish what's due and prepare ahead (what the cron does)"
        type: boolean
        default: true
      dry:
        description: "Direct mode only: render, don't publish"
        type: boolean
        default: false
      slot:
        description: "Direct mode: post this slot now (pt-news, pt-artists, pt-scene)"
        default: ""
      count:
        description: "Direct mode: posts in this run"
        default: "1"
      tip:
        description: "Direct mode: post this hand-picked story (path to a state/tips/*.json file)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: hardmag-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_HOST: ${{ secrets.IG_API_HOST }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MEDIA_REPO: ${{ github.repository }}
      BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@hardmag.news' }}
      PAUSE_UNTIL: ${{ vars.PAUSE_UNTIL }}
      AUTO: ${{ github.event_name == 'schedule' || inputs.auto }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          git config user.name "hardmag-bot"
          git config user.email "hardmag-bot@users.noreply.github.com"
      - name: Plan
        id: plan
        if: env.AUTO == 'true'
        run: node src/plan.ts >> "$GITHUB_OUTPUT"
      - name: Publish the due post
        if: steps.plan.outputs.publish == '1'
        run: node src/publish-due.ts
      - name: Install tools for writing and rendering
        if: steps.plan.outputs.prepare_slot != '' || env.AUTO != 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          npx playwright install --with-deps --only-shell chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Prepare the next slot
        if: steps.plan.outputs.prepare_slot != ''
        run: node src/run.ts --slot ${{ steps.plan.outputs.prepare_slot }} --prepare ${{ steps.plan.outputs.prepare_day }}
      - name: Direct mode (manual run)
        if: env.AUTO != 'true'
        run: |
          ARGS="--count ${{ inputs.count || '1' }}"
          if [ -n "${{ inputs.slot }}" ]; then ARGS="$ARGS --slot ${{ inputs.slot }}"; fi
          if [ -n "${{ inputs.tip }}" ]; then ARGS="--tip ${{ inputs.tip }}"; fi
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          node src/run.ts $ARGS
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: out/
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          for f in state/state.json state/articles.json state/queue.json reports/fila.md state/handles-pending.json state/performance.json state/spotlight.json state/polls.json reports/desempenho.md; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && (git pull --rebase -X theirs || (git rebase --abort; git pull --no-rebase -X ours --no-edit)) && git push)
