name: HARDMAG — post

on:
  schedule:
    # UTC. 09:00 / 14:00 / 19:00 in London, 10:00 / 15:00 / 20:00 in Berlin.
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"
    - cron: "0 19 * * *"
    # News radar: every hour, posts only if something hot breaks (see --radar in src/run.ts)
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (render only, don't publish)"
        type: boolean
        default: false
      count:
        description: "Posts in this run"
        default: "1"
      gap:
        description: "Minutes between posts (launch mode)"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: hardmag-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_HOST: ${{ secrets.IG_API_HOST }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MEDIA_REPO: ${{ github.repository }}
      BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@hardmag.news' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Claude Code (writes the posts on your Claude subscription)
        run: npm install -g @anthropic-ai/claude-code
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Run pipeline
        run: |
          git config user.name "hardmag-bot"
          git config user.email "hardmag-bot@users.noreply.github.com"
          ARGS="--count ${{ inputs.count || '1' }} --gap ${{ inputs.gap || '0' }}"
          if [ "${{ github.event.schedule }}" = "35 * * * *" ]; then ARGS="--radar"; fi
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          node src/run.ts $ARGS
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: out/
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "hardmag-bot"
          git config user.email "hardmag-bot@users.noreply.github.com"
          git add state/state.json state/articles.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase && git push)
