name: HARDMAG — post

on:
  schedule:
    # GitHub delays scheduled runs by up to hours, so we wake every 20 minutes and scripts/due.mjs
    # decides whether a slot is due. Slots (UTC = Lisbon winter time): pt-news 08:50,
    # pt-artists 13:30, pt-scene 19:45; each runs once a day, within 2.5 h of its time.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (render only, don't publish)"
        type: boolean
        default: false
      count:
        description: "Posts in this run"
        default: "1"
      gap:
        description: "Minutes between posts (launch mode)"
        default: "0"
      tip:
        description: "Post this hand-picked story instead (path to a state/tips/*.json file)"
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slot: ${{ steps.due.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: due
        env:
          PAUSE_UNTIL: ${{ vars.PAUSE_UNTIL }}
        run: |
          node scripts/due.mjs >> "$GITHUB_OUTPUT"
          if ! git diff --quiet state/slots.json 2>/dev/null || [ -n "$(git status --porcelain state/slots.json)" ]; then
            git config user.name "hardmag-bot"
            git config user.email "hardmag-bot@users.noreply.github.com"
            git add state/slots.json && git commit -qm "slot: $(grep slot= "$GITHUB_OUTPUT" | tail -1)"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi

  post:
    needs: check
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.slot != '')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    # Only the posting job is serialised, so the 20-minute check keeps running during a long post.
    concurrency:
      group: hardmag-post
      cancel-in-progress: false
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_HOST: ${{ secrets.IG_API_HOST }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MEDIA_REPO: ${{ github.repository }}
      BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@hardmag.news' }}
    steps:
      # Latest main, not the commit from when the run was queued: queued runs otherwise post
      # with old code and can't save state (rebase conflicts on a detached HEAD).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Claude Code (writes the posts on your Claude subscription)
        run: npm install -g @anthropic-ai/claude-code
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Install ffmpeg (motion covers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run pipeline
        run: |
          git config user.name "hardmag-bot"
          git config user.email "hardmag-bot@users.noreply.github.com"
          ARGS="--count ${{ inputs.count || '1' }} --gap ${{ inputs.gap || '0' }}"
          SLOT="${{ needs.check.outputs.slot }}"
          if [ -n "$SLOT" ]; then ARGS="--slot $SLOT --jitter 10"; fi
          if [ -n "${{ inputs.tip }}" ]; then ARGS="--tip ${{ inputs.tip }}"; fi
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          node src/run.ts $ARGS
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: out/
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "hardmag-bot"
          git config user.email "hardmag-bot@users.noreply.github.com"
          git add state/state.json state/articles.json state/handles-pending.json state/performance.json reports/desempenho.md 2>/dev/null || true; git add state/state.json state/articles.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase && git push)
